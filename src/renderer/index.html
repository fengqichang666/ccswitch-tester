<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCSwitch 供应商测试器</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <div class="brand-mark">C</div>
          <div>
            <h1>CCSwitch 供应商测试器</h1>
            <p id="app-version" aria-label="应用版本"></p>
          </div>
        </div>
        <div class="top-actions">
          <span id="last-sync" class="sync-label">尚未读取配置</span>
          <button id="refresh-button" class="button secondary" type="button" title="重新读取 CCSwitch 配置">↻ 刷新配置</button>
          <button id="export-button" class="button secondary" type="button" title="导出供应商 JSON 供移动端导入">⇩ 导出 JSON</button>
          <button id="sync-button" class="button secondary" type="button" title="把 Claude Code 供应商同步到 Claude Desktop">⇄ 同步到 Desktop</button>
          <button id="prompt-button" class="button secondary" type="button" title="管理随机测试语句">☷ 语句管理</button>
        </div>
      </header>

      <main class="content">
        <div class="list-toolbar">
          <div class="list-controls">
            <nav class="tabs" aria-label="供应商类型">
              <button class="tab active" data-group="claude" type="button"><span class="tab-dot claude-dot"></span>Claude 供应商 <strong id="claude-count">0</strong></button>
              <button class="tab" data-group="codex" type="button"><span class="tab-dot codex-dot"></span>Codex 供应商 <strong id="codex-count">0</strong></button>
            </nav>
            <label class="select-all"><input id="select-all" type="checkbox" />选择当前结果</label>
            <span id="selection-count" class="selection-count">未选择供应商</span>
          </div>
          <div class="list-tools">
            <label class="provider-search">
              <span aria-hidden="true">⌕</span>
              <input id="provider-search" type="search" placeholder="按名称或 Server URL 搜索" autocomplete="off" />
            </label>
            <button id="run-button" class="button primary" type="button">▶ 测试选中项</button>
          </div>
        </div>

        <section class="notice" id="page-notice" hidden></section>
        <section id="provider-list" class="provider-list" aria-live="polite"></section>
      </main>

      <div id="prompt-modal" class="modal-backdrop" hidden>
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="prompt-title">
          <div class="modal-header">
            <div>
              <p class="eyebrow">语句库</p>
              <h2 id="prompt-title">随机测试语句</h2>
            </div>
            <button id="close-prompt-button" class="icon-button" type="button" title="关闭">×</button>
          </div>
          <div class="modal-body">
            <div id="prompt-list" class="prompt-list"></div>
            <form id="prompt-form" class="prompt-form">
              <input id="prompt-id" type="hidden" />
              <label>名称<input id="prompt-name" required maxlength="60" placeholder="例如：方案判断" /></label>
              <label>语句<textarea id="prompt-text" required maxlength="500" rows="3" placeholder="输入一条自然的测试问题"></textarea></label>
              <div class="form-actions">
                <button id="cancel-prompt-button" class="button secondary" type="button">取消编辑</button>
                <button class="button primary" type="submit">保存语句</button>
              </div>
            </form>
          </div>
        </section>
      </div>

      <div id="sync-modal" class="modal-backdrop" hidden>
        <section class="modal sync-modal" role="dialog" aria-modal="true" aria-labelledby="sync-title">
          <div class="modal-header">
            <div>
              <p class="eyebrow">配置搬运</p>
              <h2 id="sync-title">同步到 Claude Desktop</h2>
              <p id="sync-subtitle" class="modal-subtitle">按 Base URL 比对，只新增桌面侧缺少的供应商，不改动已有配置。</p>
            </div>
            <button id="close-sync-button" class="icon-button" type="button" title="关闭">×</button>
          </div>
          <div class="modal-body">
            <div class="sync-toolbar">
              <label class="select-all"><input id="sync-select-all" type="checkbox" />选择全部可同步项</label>
              <span id="sync-count" class="selection-count">未选择</span>
            </div>
            <div id="sync-list" class="sync-list"></div>
            <div id="sync-result" class="sync-result" hidden></div>
            <div class="form-actions">
              <button id="sync-refresh-button" class="button secondary" type="button">重新比对</button>
              <button id="sync-run-button" class="button primary" type="button">写入 Claude Desktop</button>
            </div>
          </div>
        </section>
      </div>

      <div id="history-modal" class="modal-backdrop" hidden>
        <section class="modal history-modal" role="dialog" aria-modal="true" aria-labelledby="history-title">
          <div class="modal-header">
            <div>
              <p class="eyebrow">测试历史</p>
              <h2 id="history-title">供应商</h2>
              <p id="history-subtitle" class="modal-subtitle"></p>
            </div>
            <button id="close-history-button" class="icon-button" type="button" title="关闭">×</button>
          </div>
          <div class="modal-body">
            <div id="history-list" class="history-list"></div>
          </div>
        </section>
      </div>

      <template id="empty-template">
        <div class="empty-state">
          <div class="empty-icon">—</div>
          <h3>没有可测试的配置</h3>
          <p>CCSwitch 中未找到同时包含 key 和服务地址的供应商。</p>
        </div>
      </template>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
